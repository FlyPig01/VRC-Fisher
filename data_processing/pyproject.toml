[project]
name = "vrc-fisher-data-processing"
version = "0.1.0"
description = "Offline video and dataset tools for VRC-Fisher."
requires-python = ">=3.11,<3.12"
dependencies = [
  "av>=13,<17",
  "numpy>=2.0,<2.1",
  "pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
vrc-extract-frames = "vrc_data_processing.extract_frames:main"
vrc-build-locator = "vrc_data_processing.build_locator_dataset:main"
vrc-build-minigame = "vrc_data_processing.build_minigame_dataset:main"
vrc-split-recordings = "vrc_data_processing.split_by_recording:main"
vrc-audit-annotations = "vrc_data_processing.audit_annotations:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
