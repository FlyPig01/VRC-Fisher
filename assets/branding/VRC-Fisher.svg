<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">VRC-Fisher icon concept</title>
  <desc id="desc">An automatic recognition frame locks onto a fishing float above a rippling water surface and hook.</desc>

  <!-- Two clean wave lines indicate the water surface without a filled panel. -->
  <path d="M28 151c24 12 53 18 82 18 43 0 75-8 118-18" fill="none" stroke="#59E1F2" stroke-width="5" stroke-linecap="round"/>
  <path d="M52 179c21 9 43 13 66 13 28 0 53-5 82-13" fill="none" stroke="#2A6079" stroke-width="4" stroke-linecap="round"/>

  <!-- A classic fishing float: thin antenna, red cap, white band, blue body. -->
  <path d="M128 27v34" fill="none" stroke="#F6C453" stroke-width="6" stroke-linecap="round"/>
  <path d="M128 59c-9 0-15 7-14 16l4 42c1 9 5 14 10 14s9-5 10-14l4-42c1-9-5-16-14-16Z" fill="#F7FAFC"/>
  <path d="M114 75c-1-9 5-16 14-16s15 7 14 16l-2 19h-24Z" fill="#FF5A5F"/>
  <path d="M118 103h20l-2 14c-1 9-4 14-8 14s-7-5-8-14Z" fill="#30C4D8"/>

  <!-- The line continues below the surface into a single simple hook. -->
  <path d="M128 131v28a29 29 0 0 0 58 0v-18" fill="none" stroke="#F6C453" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m186 141-13 12" fill="none" stroke="#F6C453" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Open recognition brackets stay on top of the scene and remain visible. -->
  <path d="M43 77V51h27M186 51h27v26M43 180v26h27M186 206h27v-26" fill="none" stroke="#59E1F2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
