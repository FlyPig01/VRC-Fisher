<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">VRC-Fisher icon concept</title>
  <desc id="desc">A detailed fish head tracked by a fishing hook and targeting brackets over water.</desc>
  <rect width="256" height="256" rx="52" fill="#082F49"/>

  <!-- Targeting brackets frame the enlarged subject. -->
  <path d="M29 77V49h28M199 49h28v28M29 157v28h28M227 157v28h-28" fill="none" stroke="#67E8F9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Enlarged side-profile fish head, with room for readable facial details. -->
  <path d="M48 132c3-45 34-76 79-82 37-5 69 10 87 38l24 14-24 13c-15 31-46 49-82 53-39 4-69-9-84-36Z" fill="#FDBA74" stroke="#FFF7ED" stroke-width="5" stroke-linejoin="round"/>
  <path d="M211 102c8 0 14 4 18 10-5 7-11 10-19 10l-13-10Z" fill="#FB923C" stroke="#FFF7ED" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="166" cy="91" r="9" fill="#FFF7ED"/>
  <circle cx="168" cy="91" r="4.5" fill="#082F49"/>
  <path d="M142 99c-12 9-17 22-15 37M151 104c-8 9-11 19-10 29" fill="none" stroke="#C2410C" stroke-width="5" stroke-linecap="round"/>
  <path d="M190 115c7 4 13 5 20 3" fill="none" stroke="#9A3412" stroke-width="4" stroke-linecap="round"/>
  <path d="M87 83c14-13 29-19 45-22M86 142c14 12 29 17 45 18" fill="none" stroke="#FDBA74" stroke-width="9" stroke-linecap="round" opacity=".7"/>
  <path d="M102 92l9 7M98 112l10 5M98 132l10-4" stroke="#EA580C" stroke-width="4" stroke-linecap="round" opacity=".9"/>

  <!-- The line enters the mouth; the hook hangs below it instead of crossing the fish. -->
  <path d="M211 27v75c0 8-3 13-9 16" fill="none" stroke="#FDE68A" stroke-width="7" stroke-linecap="round"/>
  <path d="M202 116c1 24 6 42-5 57-8 12-23 17-34 9-9-7-8-18-1-27" fill="none" stroke="#FDE68A" stroke-width="8" stroke-linecap="round"/>
  <path d="m162 155-10-5 3 12" fill="none" stroke="#FDE68A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Water anchors the fishing meaning without obscuring the subject. -->
  <path d="M31 211c19-13 38-13 57 0s38 13 57 0 38-13 57 0 38 13 57 0" fill="none" stroke="#38BDF8" stroke-width="9" stroke-linecap="round"/>
  <path d="M48 234c14-8 28-8 42 0s28 8 42 0 28-8 42 0 28 8 42 0" fill="none" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" opacity=".85"/>

  <!-- Small tracking nodes suggest automatic following, not a hand-drawn lure. -->
  <circle cx="72" cy="34" r="5" fill="#67E8F9"/>
  <circle cx="89" cy="34" r="5" fill="#67E8F9" opacity=".75"/>
  <circle cx="106" cy="34" r="5" fill="#67E8F9" opacity=".5"/>
</svg>
