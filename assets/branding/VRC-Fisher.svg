<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">VRC-Fisher icon concept</title>
  <desc id="desc">A clearly visible fish tracked by a fishing hook and targeting brackets over water.</desc>
  <rect width="256" height="256" rx="52" fill="#082F49"/>

  <!-- Targeting brackets make the computer-vision function readable at icon size. -->
  <path d="M31 84V58h26M199 58h26v26M31 148v26h26M225 148v26h-26" fill="none" stroke="#67E8F9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Large side-profile fish silhouette. -->
  <path d="M77 110 39 83l8 29-8 29 38-27c22 24 55 32 83 19 13-6 23-15 30-24-7-10-17-18-30-24-28-13-61-5-83 19Z" fill="#FDBA74" stroke="#FFF7ED" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="157" cy="106" r="5.5" fill="#082F49"/>
  <path d="M181 111c-5 3-8 7-9 12" fill="none" stroke="#C2410C" stroke-width="4" stroke-linecap="round"/>

  <!-- Fishing line and unmistakable hook. -->
  <path d="M181 31v76c0 18 1 33-8 47-7 11-18 16-27 10-7-5-8-13-3-20" fill="none" stroke="#FDE68A" stroke-width="8" stroke-linecap="round"/>
  <path d="m143 144-9-5 2 11" fill="none" stroke="#FDE68A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Water anchors the fishing meaning without obscuring the subject. -->
  <path d="M31 205c19-13 38-13 57 0s38 13 57 0 38-13 57 0 38 13 57 0" fill="none" stroke="#38BDF8" stroke-width="9" stroke-linecap="round"/>
  <path d="M48 228c14-8 28-8 42 0s28 8 42 0 28-8 42 0 28 8 42 0" fill="none" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" opacity=".85"/>

  <!-- Small tracking nodes suggest automatic following, not a hand-drawn lure. -->
  <circle cx="72" cy="45" r="6" fill="#67E8F9"/>
  <circle cx="91" cy="45" r="6" fill="#67E8F9" opacity=".75"/>
  <circle cx="110" cy="45" r="6" fill="#67E8F9" opacity=".5"/>
</svg>
