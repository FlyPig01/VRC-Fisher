[window]
title_contains = "VRChat"
activate_interval_seconds = 5.0

[capture]
monitor = 1
target_fps = 30.0

[vision]
locator_model = "models/locator.onnx"
minigame_model = "models/minigame.onnx"
device = "auto"
input_size = 640
intra_op_threads = 2
locator_interval_frames = 3
iou_threshold = 0.45
crop_padding = 0.08
prompt_confirm_frames = 2
ui_confirm_frames = 4
ui_lost_frames = 4
success_confirm_frames = 6
failure_confirm_frames = 4
min_confidence = 0.35

[timing]
cast_settle_seconds = 1.2
bite_timeout_seconds = 45.0
hook_to_ui_min_seconds = 0.4
prompt_to_ui_timeout_seconds = 3.0
minigame_timeout_seconds = 35.0
reward_min_wait_seconds = 1.0
loot_timeout_seconds = 7.0
cycle_delay_seconds = 1.0
recovery_delay_seconds = 2.0

[control]
vertical_deadband = 0.06
click_duration_seconds = 0.04

[debug]
save_failures = true
log_level = "INFO"
